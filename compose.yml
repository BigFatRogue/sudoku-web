services:
  db:
    image: postgres:16
    container_name: sudoku_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dbnet
  adminer_db:
    image: adminer
    container_name: adminer
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - dbnet
    depends_on:
      - db

  app:
    build: .
    container_name: sudoku_app
    depends_on:
      - db
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    networks:
      - dbnet
 
networks:
  dbnet:
    driver: bridge

volumes:
  postgres-data:    

